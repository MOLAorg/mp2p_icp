# Learned covariance of LiDAR odometry increments (mp2p_icp::IncrementCovarianceModel).
# Per-axis MLP on the eigen-axes of the pairing information (rotations scaled by
# rotation_length_scale), trained on accumulated 1-10 s errors against RTK + gyroscope.
# Valid for the platform, sensor and pipeline settings below only: retrain for others.
format: mp2p_icp.IncrementCovarianceModel
