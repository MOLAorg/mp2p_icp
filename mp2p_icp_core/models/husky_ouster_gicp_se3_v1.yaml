  training_code_commit: "none"
  license: "BSD-3-Clause (trained on the authors' own recordings)"
pipeline:
  icp: "mola_lidar_odometry lidar3d-gicp.yaml, voxel 0.15 / 0.10 m, IncrementalPointCloud 60 m, gyro rotation prior"
