  trained_on: [husky_2026-11-19_16-19-51_big, husky_2026-11-16_10-00-26_rtk_ptp]
  ground_truth: "u-blox ZED-F9P RTK fixed epochs (translation), Ouster IMU gyroscope (rotation)"
