# Learned covariance of LiDAR odometry increments (mp2p_icp::IncrementCovarianceModel).
# Per-axis MLP on the eigen-axes of the pairing information (rotations scaled by
# rotation_length_scale), trained on accumulated errors over windows of several seconds.
# Valid only for the platform, sensor and pipeline settings it was trained with.
format: mp2p_icp.IncrementCovarianceModel
version: 1
description: "Clearpath Husky A200, Ouster LiDAR at 10 Hz, MOLA LIO lidar3d-gicp (default decimation), map-less"
provenance:
  trained_on: ["husky_2026-11-19_16-19-51_big", "husky_2026-11-16_10-00-26_rtk_ptp"]
  ground_truth: "u-blox ZED-F9P RTK fixed epochs (translation), Ouster IMU gyroscope (rotation)"
  date: "2026-11-21"
  training_code_commit: "mola_lo_covariance_training 51ecbae"
  license: "BSD-3-Clause (trained on the authors' own recordings)"
pipeline:
  icp: "mola_lidar_odometry lidar3d-gicp.yaml, voxel 0.15 / 0.10 m, IncrementalPointCloud 60 m, gyro rotation prior"
