# -----------------------------------------------------------------------------
# Pipeline definition file for mm-filter
#
# See: https://github.com/MOLAorg/mp2p_icp/tree/develop/mp2p_icp_core/apps/mm-filter
#
# Explanation of this particular pipeline:
# Takes a .mm file with a plain point cloud layer (e.g. as generated by txt2mm,
# kitti2mm, sm2mm, etc.) and inserts its points into a brand-new layer of class
# mola::KeyframePointCloudMap, ready to be used for GICP localization-only mode.
#
# Run with:
#   mm-filter -i input.mm -o output.mm -p mm-filter_create_keyframe_map_layer.yaml -l libmola_metric_maps.so
# -----------------------------------------------------------------------------

# --------------------------------------------------------
# 1) Generators: only used here to pre-create the new,
#    empty "localmap" layer (no observations are involved
#    when running mm-filter over an already-built .mm file)
# --------------------------------------------------------
generators:
  - class_name: mp2p_icp_filters::Generator
    params:
      target_layer: "localmap"
      # Do not try to insert any observation directly (there is none in mm-filter):
      process_class_names_regex: ""

      metric_map_definition:
        # Any class derived from mrpt::maps::CMetricMap https://docs.mrpt.org/reference/stable/group_mrpt_maps_grp.html
        class: mola::KeyframePointCloudMap
        plugin: "libmola_metric_maps.so" # Import additional custom user-defined map classes (search in LD_LIBRARY_PATH)
        creationOpts:
          max_search_keyframes: 3
          k_correspondences_for_cov: 20
        insertOpts:
          remove_frames_farther_than: 0 # [m]
        likelihoodOpts: ~ # none required

# -------------------------------------------------------------------
# 2) Filters: merge the existing points into the new layer, then drop
#    the original one.
# -------------------------------------------------------------------
filters:
  - class_name: mp2p_icp_filters::FilterMerge
    params:
      input_pointcloud_layer: "raw" # rename to match your input layer name
      target_layer: "localmap"

  - class_name: mp2p_icp_filters::FilterDeleteLayer
    params:
      pointcloud_layer_to_remove: ["raw"]
