name: CI clang-format

on: [push, pull_request]

jobs:
  clang-format-check:
    name: clang-format-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Git submodules
        run: |
          git submodule sync
          git submodule update --init --recursive

      - name: Install clang-format-14
        # Not packaged for the current Ubuntu runners: from PyPI instead
        run: |
          pipx install clang-format==14.0.6
          sudo ln -sf "$(command -v clang-format)" /usr/local/bin/clang-format-14
          clang-format-14 --version

      - name: Check code style
        run: bash mp2p_icp_core/scripts/formatter.sh --check
