# Based on GTSAM file (by @ProfFan)
name: CI Build colcon

on: [push]

jobs:
  build_docker: # On Linux, iterates on all ROS 1 and ROS 2 distributions.
    runs-on: ubuntu-latest
    env:
      DEBIAN_FRONTEND: noninteractive
    strategy:
      matrix:
        # Define the Docker image(s) associated with each ROS distribution.
        # The include syntax allows additional variables to be defined, like
        # docker_image in this case. See documentation:
        # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#example-including-configurations-in-a-matrix-build
        #
        # Platforms are defined in REP 3 and REP 2000:
        # https://ros.org/reps/rep-0003.html
        # https://ros.org/reps/rep-2000.html
        include:
          # Humble Hawksbill (May 2022 - May 2027)
          - docker_image: ubuntu:jammy
            ros_distribution: humble
            use_ros_testing: false

          - docker_image: ubuntu:jammy
            ros_distribution: humble
            use_ros_testing: true

          # Jazzy (2024 - ??)
          - docker_image: ubuntu:noble
            ros_distribution: jazzy
            use_ros_testing: false

          - docker_image: ubuntu:noble
            ros_distribution: jazzy
            use_ros_testing: true

          # Rolling Ridley (No End-Of-Life)
          - docker_image: ubuntu:noble
            ros_distribution: rolling
            use_ros_testing: false

          - docker_image: ubuntu:noble
            ros_distribution: rolling
            use_ros_testing: true

          # Same as above, but disable TBB
          - docker_image: ubuntu:noble
            ros_distribution: rolling
            use_ros_testing: true
            disable_tbb: true

          - docker_image: ubuntu:noble
            ros_distribution: rolling
            use_ros_testing: true
            coverage_run: true

    container:
      image: ${{ matrix.docker_image }}

    steps:
      - name: Checkout
        run: |
          apt-get -y update
          apt-get -y install git
          git clone https://github.com/$GITHUB_REPOSITORY.git --recursive "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git checkout $GITHUB_SHA
          git submodule update --init --recursive

      - name: setup ROS environment
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ matrix.ros_distribution }}
          use-ros2-testing: ${{ matrix.use_ros_testing }}

      - name: Install rosdep dependencies
        run: |
          . /opt/ros/*/setup.sh
          rosdep update
          rosdep install --from-paths . --ignore-src -r -y

      - name: Install lcov for coverage analysis
        if: matrix.coverage_run == true
        run: |
          apt-get update
          # gcov is already installed with build-essential, but we need lcov
          apt-get install -y lcov

      - name: Build with colcon
        run: |
          . /opt/ros/*/setup.sh
          # If disable_tbb is true, add the CMake flag to disable TBB
          if [ "${{ matrix.disable_tbb }}" = "true" ]; then
            echo "Disabling TBB..."
            EXTRA_CMAKE_ARGS="-DMP2PICP_USE_TBB=OFF"
          else
            EXTRA_CMAKE_ARGS=""
          fi


          if [ "${{ matrix.coverage_run }}" = "true" ]; then
            echo "Enabling Coverage build type..."
            EXTRA_CMAKE_ARGS="$EXTRA_CMAKE_ARGS -DCMAKE_BUILD_TYPE=Coverage"
          fi

          env
          MAKEFLAGS="-j2" colcon build \
            --symlink-install \
            --parallel-workers 2 \
            --event-handlers console_direct+ \
            --cmake-args $EXTRA_CMAKE_ARGS

      - name: Run unit tests
        run: |
          . /opt/ros/*/setup.sh
          colcon test --event-handlers console_direct+
          colcon test-result --verbose

      - name: Generate coverage report
        if: matrix.coverage_run == true
        run: |
          # 1. Capture coverage data across the entire workspace.
          #    --ignore-errors mismatch fixes common gcov/geninfo parsing errors
          lcov --capture --directory . --output-file coverage.info --ignore-errors mismatch

          # 2. Filter the report to only include your source files.
          #    We assume the core library files are NOT in 3rdparty, tests, apps, or external folders.
          lcov --remove coverage.info '*/3rdparty/*' --output-file coverage_filtered.info
          lcov --remove coverage_filtered.info '*/tests/*' --output-file coverage_filtered.info
          lcov --remove coverage_filtered.info '*/apps/*' --output-file coverage_filtered.info
          lcov --remove coverage_filtered.info '*/mola_common/*' --output-file coverage_filtered.info
          lcov --remove coverage_filtered.info '/opt/ros/*' --output-file coverage_filtered.info
          lcov --remove coverage_filtered.info '/usr/*' --output-file coverage_filtered.info

          # 3. Print a summary to the log
          echo "--- Coverage Summary for MP2P-ICP Core ---"
          lcov --list coverage_filtered.info
          echo "------------------------------------------"

      - name: Upload coverage to Codecov
        if: matrix.coverage_run == true
        uses: codecov/codecov-action@v4
        with:
          #token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage_filtered.info
          name: codecov-mp2p-icp-colcon
          fail_ci_if_error: true
