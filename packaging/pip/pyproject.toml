# Python wheel for mp2p_icp: the `mp2p_icp` package (bindings of the
# mp2p_icp_core C++ libraries) and their C++ SDK (mp2p_icp/sdk), built on top
# of the `mrpt3` wheel.
# See README-dev.md for how to build it.

[build-system]
# - pybind11 must be the version of the mrpt3 wheel (mrpt.sdk.PYBIND11_VERSION),
#   to share Python types with it.
# - mrpt3: its C++ SDK is what the wheel is built against, and its version sets
#   the mrpt3 requirement of the wheel (see build_helpers/mrpt3_requirement.py).
requires = ["scikit-build-core>=0.11", "pybind11==3.1.0", "mrpt3==3.6.2"]
build-backend = "scikit_build_core.build"

[project]
name = "mp2p-icp"
dynamic = ["version", "dependencies"]
description = "Point cloud registration (ICP), metric maps and point cloud pipelines, from the MOLA mp2p_icp C++ libraries"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Jose Luis Blanco-Claraco" }]
keywords = ["robotics", "slam", "mapping", "point-clouds", "icp", "registration", "lidar"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]

# Optional dependencies, only imported by the functions that need them:
[project.optional-dependencies]
open3d = ["open3d"]
pyvista = ["pyvista"]
pandas = ["pandas", "pyarrow"]
las = ["laspy[lazrs]"]
all = ["mp2p-icp[open3d,pyvista,pandas,las]"]

[project.urls]
Homepage = "https://github.com/MOLAorg/mp2p_icp"
Documentation = "https://docs.mola-slam.org/latest/module-mp2p-icp.html"
Source = "https://github.com/MOLAorg/mp2p_icp"
Issues = "https://github.com/MOLAorg/mp2p_icp/issues"

# Lets scikit-build-core based wheels find the mp2p_icp and mola_common CMake
# packages of the C++ SDK (mp2p_icp/sdk):
[project.entry-points."cmake.prefix"]
mp2p_icp = "mp2p_icp.sdk"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.24"
build.verbose = true
# Everything in the wheel comes from the CMake install step:
wheel.packages = []
# Persistent build dir, for incremental rebuilds while developing:
build-dir = "build/{wheel_tag}"
# Needed for the local metadata provider (build_helpers/):
experimental = true

# cibuildwheel copies the source tree into its containers: do not reuse a
# local build dir from the host there.
[[tool.scikit-build.overrides]]
if.env.CIBUILDWHEEL = true
build-dir = "build-cibw/{wheel_tag}"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "../../mp2p_icp_core/package.xml"
regex = '<version>(?P<value>[0-9]+\.[0-9]+\.[0-9]+)</version>'

[tool.scikit-build.metadata.dependencies]
provider = "mrpt3_requirement"
provider-path = "build_helpers"
requires = ["numpy"]

[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_* *_i686"
build-verbosity = 1
# cmake, ninja and pybind11: for the C++ SDK consumer test
test-requires = ["pytest", "cmake", "ninja", "pybind11==3.1.0"]
test-command = "python {package}/tests/test_wheel.py"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
before-all = "bash {package}/ci/manylinux_deps.sh"
# Never bundle the MRPT libraries nor the oneTBB of the MRPT SDK: they come
# from the mrpt3 wheel (one MRPT class registry per process). The OpenGL
# (libglvnd) libraries must come from the user system, as in mrpt3.
# --only-plat: no older manylinux tag than the image one, which mrpt3 needs.
repair-wheel-command = """\
  auditwheel repair -w {dest_dir} --only-plat \
    --exclude 'libmrpt_*.so' --exclude 'libtbb*.so*' \
    --exclude libEGL.so.1 --exclude libGLX.so.0 --exclude libOpenGL.so.0 \
    --exclude libGLESv2.so.2 --exclude libGLdispatch.so.0 \
    {wheel}"""
# The C++ libraries do not depend on the Python version: ccache compiles them
# only once per image. CCACHE_BASEDIR makes hits independent of the build dir.
environment = { CMAKE_ARGS = "-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache", CCACHE_BASEDIR = "/project", CCACHE_DIR = "/project/.ccache", CCACHE_MAXSIZE = "2G" }
